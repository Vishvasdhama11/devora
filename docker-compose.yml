version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: devora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: devora
      POSTGRES_USER: devora
      POSTGRES_PASSWORD: devora-password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devora -d devora"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://devora:devora-password@postgres:5432/devora
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: change-me

volumes:
  postgres_data:
